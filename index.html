    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('nexafaq_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F6F1] dark:bg-[#171619] text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200">
